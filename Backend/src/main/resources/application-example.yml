spring:
  # 개인 로컬 설정(내 DB 비밀번호·메일 계정 등)은 application-local.yml에 두면 이 파일을 덮어씀 (gitignore 대상 — 커밋 안 됨)
  # 만드는 법: application-local-example.yml 복사 → application-local.yml → 값 수정
  config:
    import: "optional:classpath:application-local.yml"

  # 팀 공용 Aiven 클라우드 MySQL 기준. 비밀번호는 커밋 금지 — 아래 password는 반드시 채워 넣어야 함.
  # (application-local.yml에 password만 따로 두면 이 파일을 덮어써서 더 안전 — 하단 예시 참고)
  datasource:
    url: jdbc:mysql://ibm-project1-ibmproject1.l.aivencloud.com:23648/popupdb?useSSL=true&requireSSL=true&serverTimezone=Asia/Seoul
    username: avnadmin
    password: "<Aiven DB 비밀번호 — 팀에서 공유받아 입력>"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  # 웨이팅 입장 QR 메일 발송용 (EmailNotificationService — host 없으면 기동 실패)
  # username을 비워두면 발송은 스킵되고 로그만 남음. 실제 발송하려면 Gmail 앱 비밀번호 입력.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ""
    password: ""
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # [통합] 소비자 카카오 소셜 로그인 (구 customerbackend에서 이관)
  # 주의: 카카오 개발자 콘솔의 Redirect URI를 8081 → 8080 으로 재등록해야 동작함
  #   http://localhost:8080/login/oauth2/code/kakao
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: "d2bb708c4eb5a39b31bafcde57cacbc4"
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: "po2zg+6RlGd7S+vA+nfM86hgViC/4209T+SV0qQQdzZYoqBcL5GmDGnce/RHfdETClvu0CkxzytGwEilv3tRJA=="
  expiration: 86400000   # 24시간 (ms)

file:
  # ※ 반드시 절대경로로 적을 것. 상대경로(uploads)면 백엔드를 어디서 실행하느냐에 따라
  #   저장 폴더가 갈린다 (IDE 실행 = 리포 루트/uploads, 터미널에서 Backend/ 진입 = Backend/uploads).
  #   같은 기계인데도 방금 업로드한 이미지가 404가 되는 원인. 본인 경로로 바꿔 쓰세요.
  upload-dir: C:/경로/popup-store-project/uploads
  # 파일이 서빙되는 주소. 이 값이 DB(popup_image.image_url)에 그대로 저장되므로
  # 배포 시에는 실제 도메인으로 바꿔야 한다 (기존 행은 별도 일괄 치환 필요).
  base-url: http://localhost:8080/uploads

# ── 개인 로컬 오버라이드 예시 ──
# 이 파일을 같은 폴더에 application-local.yml 로 복사한 뒤 본인 값으로 수정하세요.
# application-local.yml은 gitignore 대상이라 커밋되지 않습니다 (비밀번호를 application.yml에 직접 고치면 커밋 사고 위험).
# 여기에 적은 키만 application.yml 값을 덮어씁니다 — 바꿀 것만 남기고 지워도 됩니다.

spring:
  datasource:
    # 팀에서 공유받은 Aiven DB 비밀번호를 여기에 (application.yml에 직접 넣지 말 것 — 커밋 사고 방지)
    password: "<Aiven DB 비밀번호>"

  # 웨이팅 입장 QR 메일을 실제로 발송해보고 싶을 때만 (Gmail 앱 비밀번호 필요, 비워두면 발송 스킵)
  # mail:
  #   username: "myaccount@gmail.com"
  #   password: "<앱 비밀번호 16자리>"


# ── 외부 API 키 (선택 — 없으면 해당 기능만 스킵) ──
# 국세청 사업자 진위확인: data.go.kr "사업자등록정보 진위확인 및 상태조회" 활용신청 후 인증키
nts:
  api:
    service-key: ""

# 네이버 클라우드(NCP) Maps Geocoding: ncloud.com 콘솔 > Maps > Application 등록 후 발급
naver:
  maps:
    client-id: ""
    client-secret: ""
