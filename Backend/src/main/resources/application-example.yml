# ─────────────────────────────────────────────────────────────
# POPON 통합 백엔드 설정 예시
#
# 사용법: 이 파일을 같은 폴더에 application.yml 로 복사한 뒤 <...> 부분을 채우세요.
#        application.yml 은 비밀값이 들어가므로 커밋하지 않습니다 (.gitignore 대상).
#
# 표시 안내
#   [필수] 비어 있으면 서버가 시작되지 않음
#   [선택] 비워두면 해당 기능만 동작하지 않음
# ─────────────────────────────────────────────────────────────

spring:
  # 개인 PC마다 다른 값(DB 비밀번호 등)은 application-local.yml 에 따로 두면 이 파일 값을 덮어씁니다.
  # 만드는 법: application-local-example.yml 복사 → application-local.yml → 값 수정
  config:
    import: "optional:classpath:application-local.yml"

  # [필수] MySQL 접속 정보
  datasource:
    url: jdbc:mysql://localhost:3306/popupdb?serverTimezone=Asia/Seoul
    username: <DB 사용자명>
    password: <DB 비밀번호>
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # 엔티티 기준으로 테이블 자동 생성 · 수정

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  # 입장 QR 메일 발송 (Gmail SMTP)
  # host 는 [필수] — 없으면 서버가 시작되지 않음
  # username · password 는 [선택] — 비워두면 메일 발송을 건너뛰고 로그만 남김
  mail:
    host: smtp.gmail.com
    port: 587
    username: ""              # 발송용 Gmail 주소
    password: ""              # Gmail 앱 비밀번호 (16자리)
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # [필수] 소비자 소셜 로그인 (카카오 · 구글)
  # 각 개발자 콘솔에 Redirect URI 를 등록해야 합니다.
  #   카카오: http://localhost:8080/login/oauth2/code/kakao
  #   구글  : http://localhost:8080/login/oauth2/code/google
  # 구글은 리디렉션 URI 에 IP 주소를 허용하지 않으므로, 배포 시에는 도메인이 필요합니다.
  # 구글 로그인을 쓰지 않는다면 google 블록 전체를 지우세요. (빈 값으로 두면 시작 실패)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: <카카오 REST API 키>
            client-secret: <카카오 Client Secret>
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
          google:
            client-id: <구글 OAuth 클라이언트 ID>
            client-secret: <구글 OAuth 클라이언트 보안 비밀>
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# [필수] JWT 서명키
# 소비자 토큰과 직원(주최자 · 관리자) 토큰은 서로 다른 키로 서명합니다. 두 값은 반드시 달라야 합니다.
# 생성 예: openssl rand -base64 64
jwt:
  consumer-secret: <소비자용 랜덤 시크릿>
  staff-secret: <직원용 랜덤 시크릿>
  expiration: 86400000        # 토큰 유효시간 24시간 (ms)

# [필수] 업로드 파일 저장
file:
  # 반드시 절대경로로 지정하세요.
  # 상대경로면 실행 위치(IDE · 터미널)에 따라 저장 폴더가 달라져 이미지가 404가 될 수 있습니다.
  upload-dir: <프로젝트 루트의 uploads 폴더 절대경로>   # 예: C:/dev/popon/uploads
  # DB에 저장되는 이미지 URL 앞부분. 서버 주소가 바뀌어도 깨지지 않도록 상대경로를 유지하세요.
  base-url: /uploads

app:
  # 소셜 로그인 성공 후 돌아갈 소비자 앱 주소
  frontend-base-url: http://localhost:5173
  # [필수] 문자 · 메일로 보내는 입장 QR 링크의 앞부분 (소비자 앱 주소, /qr/{token} 으로 연결)
  qr-base-url: http://localhost:5173
  # [필수] 배너 링크 앞부분 (소비자 앱 주소 + /popup/{id})
  customer-base-url: http://localhost:5173
  # 소셜 로그인 없이 테스트 계정을 발급하는 개발용 로그인
  # 로컬에서만 true. 외부에 공개되는 서버에서는 반드시 false
  dev-login:
    enabled: true

# [선택] 네이버 클라우드 Maps — 주소를 좌표로 변환 (팝업 · 공간 등록 시)
# NCP 콘솔 > Maps > Application 등록 후 발급
naver:
  maps:
    client-id: ""
    client-secret: ""

# [선택] 국세청 사업자등록 진위확인 — 주최자 회원가입 2단계
# 공공데이터포털 "사업자등록정보 진위확인 및 상태조회" 활용신청 후 인증키
nts:
  api:
    service-key: ""

# [선택] 네이버 클라우드 SENS — 입장 QR 문자 발송
# 비워두면 문자 발송을 건너뛰고 로그만 남김
notification:
  sms:
    naver:
      service-id: ""
      access-key: ""
      secret-key: ""
      sender-phone: ""        # SENS 에 등록한 발신 번호 (숫자만)
