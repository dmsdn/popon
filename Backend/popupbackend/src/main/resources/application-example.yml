# ─────────────────────────────────────────────────────────────
# application.yml 템플릿
# 이 파일을 같은 폴더에 application.yml로 복사한 뒤 아래 값을 채워 주세요.
# application.yml은 .gitignore에 등록되어 있어 커밋되지 않습니다.
# ─────────────────────────────────────────────────────────────
server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://localhost:3306/popupdb
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true


  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

jwt:
  # 충분히 긴 랜덤 문자열 (예: openssl rand -base64 64 로 생성)
  secret: popup-team-secret-key-change-this-later-1234567890
  expiration: 86400000   # 토큰 유효기간 24시간 (ms)

file:
  upload-dir: C:/project1/uploads
  base-url: http://localhost:8080/uploads