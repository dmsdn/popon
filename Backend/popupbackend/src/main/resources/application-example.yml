# ─────────────────────────────────────────────────────────────
# application.yml 템플릿
# 이 파일을 같은 폴더에 application.yml로 복사한 뒤 아래 값을 채워 주세요.
# application.yml은 .gitignore에 등록되어 있어 커밋되지 않습니다.
# ─────────────────────────────────────────────────────────────

spring:
  datasource:
    # popupdb가 없으면 첫 실행 때 자동 생성됩니다 (createDatabaseIfNotExist)
    url: jdbc:mysql://localhost:3306/popupdb?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: "여기에-본인-MySQL-비밀번호"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 엔티티 기준으로 테이블 자동 생성/변경

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  # 웨이팅 입장 QR 메일 발송용 (EmailNotificationService — 이 섹션이 없으면 기동 실패)
  # username을 비워두면 발송은 스킵되고 로그만 남음. 실제 발송하려면 Gmail 주소+앱 비밀번호 입력.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ""
    password: ""
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  # 충분히 긴 랜덤 문자열 (예: openssl rand -base64 64 로 생성)
  secret: "여기에-랜덤-시크릿-키"
  expiration: 86400000   # 토큰 유효기간 24시간 (ms)

file:
  upload-dir: uploads                        # 업로드 이미지 저장 폴더 (실행 위치 기준)
  base-url: http://localhost:8080/uploads    # 이미지 접근 URL
