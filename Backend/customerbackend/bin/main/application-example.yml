# ─────────────────────────────────────────────────────────────
# 소비자측 백엔드 application.yml 템플릿
# 이 파일을 같은 폴더에 application.yml로 복사한 뒤 아래 값을 채워 주세요.
# application.yml은 .gitignore에 등록되어 있어 커밋되지 않습니다.
#
# ※ 주최자측(popupbackend)이 8080 포트를 쓰므로 이쪽은 8081로 설정
#    (두 백엔드 동시 실행을 위함)
# ─────────────────────────────────────────────────────────────

server:
  port: 8081

spring:
  datasource:
    # popup_db가 없으면 첫 실행 때 자동 생성됩니다 (createDatabaseIfNotExist)
    url: jdbc:mysql://localhost:3306/popupdb?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: "여기에-본인-MySQL-비밀번호"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 엔티티 기준으로 테이블 자동 생성/변경

  security:
    oauth2:
      client:
        registration:
          kakao:
            # 카카오 개발자 콘솔(developers.kakao.com) > 앱 키 > REST API 키
            # Redirect URI 등록 필요: http://localhost:8081/login/oauth2/code/kakao
            # 동의항목: 닉네임(필수), 프로필 사진 활성화 필요
            client-id: "여기에-카카오-REST-API-키"
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  # 충분히 긴 랜덤 문자열 (예: openssl rand -base64 64 로 생성)
  # ※ 주최자측(popupbackend)과 동일한 값을 쓰면 토큰 호환 가능
  secret: "여기에-랜덤-시크릿-키"
  expiration: 86400000   # 토큰 유효기간 24시간 (ms)
